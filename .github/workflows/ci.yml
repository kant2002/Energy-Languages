name: Build

on: 
  - pull_request
  - workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        #os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    # Not specifying a version will attempt to install via global.json
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - uses: fortran-lang/setup-fortran@v1
      name: Setup Fortran
      with:
        compiler: intel
        version: "2025.0"

    - name: Setup Lisp
      run: |
        sudo apt-get install -y sbcl

    - name: Install FPC
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y fpc

    - uses: haskell-actions/setup@v2.8
      name: Setup Haskell
      with:
        ghc-version: 9.12.2 

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      name: Setup Rust
      with:
        toolchain: stable

    - uses: ruby/setup-ruby@v1
      name: Setup Ruby
      with:
        ruby-version: '3.4'

    - uses: ruby/setup-ruby@v1
      name: Setup JRuby
      with:
        ruby-version: 'jruby'

    - uses: ada-actions/toolchain@dev
      name: Setup Ada
      with:
        distrib: fsf
        target: native

    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5

    - uses: erlangsters/setup-erlang@v1
      with:
        erlang-version: 27
        install-rebar3: true

    - uses: SwiftyLab/setup-swift@latest

    - name: Install Chapel
      run: |
        curl -LO https://github.com/chapel-lang/chapel/releases/download/2.5.0/chapel-2.5.0-1.ubuntu24.amd64.deb
        echo "499ca0b4c2b022f99924544987b7ee3e86458ba2d7ce8ad3d0151bcabf8f09e5  chapel-2.5.0-1.ubuntu24.amd64.deb" | shasum -a 256 -c
        sudo apt-get install -y ./chapel-2.5.0-1.ubuntu24.amd64.deb

    - name: Prepare build env
      run: |
        pip install -r requirements.txt
        sudo apt-get install -y libpcre3 libpcre3-dev libboost-regex-dev libhts-dev libapr1-dev
        ./gen-input.sh

    - name: Run tests
      run: |
        python compile_all.py