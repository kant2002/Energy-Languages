name: Build

on: [pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        #os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    # Not specifying a version will attempt to install via global.json
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - uses: fortran-lang/setup-fortran@v1
      name: Setup Fortran
      with:
        compiler: intel
        version: "2025.0"

    - name: Setup Lisp
      run: |
        sudo apt-get install -y sbcl

    - name: Install FPC
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y fpc

    - uses: haskell-actions/setup@v2.8
      name: Setup Haskell
      with:
        ghc-version: 9.12.2 

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      name: Setup Rust
      with:
        toolchain: stable

    - uses: ruby/setup-ruby@v1
      name: Setup Ruby
      with:
        ruby-version: '3.4'

    - uses: ruby/setup-ruby@v1
      name: Setup JRuby
      with:
        ruby-version: 'jruby'

    - uses: ada-actions/toolchain@dev
      name: Setup Ada
      with:
        distrib: fsf
        target: native

    - name: Prepare build env
      run: |
        pip install -r requirements.txt
        sudo apt-get install -y libpcre-dev
        ./gen-input.sh

    - name: Run tests
      run: |
        python compile_all.py